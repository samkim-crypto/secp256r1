[workspace]
members = ["program", "secp256r1-verify"]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
    'cfg(feature, values("custom-panic"))',
] }

[workspace.dependencies]
p256 = "0.14.0"
pinocchio = "0.11.2"
solana-address = "2.7.0"
solana-define-syscall = "5.2.0"
solana-instruction = "3.3.0"
solana-program-test = { version = "=4.5.0-beta.0", features = ["agave-unstable-api"] }
solana-secp256r1 = "0.1.0"
solana-secp256r1-verify = { path = "secp256r1-verify", version = "0.1.0", default-features = false }
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
solana-signer = "4.0.0"
solana-transaction = { version = "6.0.0", features = ["wincode"] }
