[package]
name = "solana-secp256r1-verify"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = ["verify", "instruction"]
instruction = ["dep:solana-instruction", "dep:solana-address"]
verify = [
    "dep:solana-define-syscall",
    "dep:solana-secp256r1",
    "dep:solana-sha256-hasher",
]

[dependencies]
solana-address = { workspace = true, optional = true }
solana-instruction = { workspace = true, optional = true }
solana-sha256-hasher = { workspace = true, optional = true }

[dev-dependencies]
p256 = { workspace = true }

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-secp256r1 = { workspace = true, optional = true }

[target.'cfg(target_os = "solana")'.dependencies]
solana-define-syscall = { workspace = true, optional = true }

[lints]
workspace = true
