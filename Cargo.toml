[workspace]
members = ["program", "secp256r1-verify"]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
    'cfg(feature, values("custom-panic"))',
] }

[workspace.dependencies]
mollusk-svm = "0.13.4"
p256 = "0.13.2"
pinocchio = "0.11.2"
solana-account = "3.4.0"
solana-address = "2.7.0"
solana-instruction = "3.3.0"
solana-secp256r1-verify = { path = "secp256r1-verify", version = "0.1.0", default-features = false }
solana-sha256-hasher = "3.1.0"
